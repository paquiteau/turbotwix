[project]
name = "turbotwix"
version = "0.1.0"
description = "High-throughput reader for Siemens MRI raw data (.dat / TWIX) files"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pierre-antoine Comby", email = "pierre-antoine.comby@crans.org" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
]
parity = [
    "pymapvbvd",
    "twixtools",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
