[project]
name = "turbotwix"
version = "0.1.1"
description = "High-throughput reader for Siemens MRI raw data (.dat / TWIX) files"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pierre-antoine Comby", email = "pierre-antoine.comby@crans.org" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
]
parity = [
    "pymapvbvd",
    "twixtools",
]
progress = [
    "tqdm",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the submodules' public and test-facing names.
"src/turbotwix/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
